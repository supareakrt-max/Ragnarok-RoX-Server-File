//--------------------------------------------------------------
// AI Bot Bridge Configuration
//--------------------------------------------------------------
// The map-server opens a TCP port that an external "brain"
// (see tools/aibot) connects to. The brain logs in bot characters
// (no game client needed) and controls them with JSON commands.
// Protocol reference: doc/aibot_protocol.md
//
// Put your local overrides in conf/import/aibot_conf.txt
//--------------------------------------------------------------

// Enable the bridge? (yes/no)
enabled: yes

// IP and port the bridge listens on.
// Keep 127.0.0.1 unless the brain runs on another machine. If you open it
// to the network, ALWAYS set a token and firewall the port.
bind_ip: 127.0.0.1
port: 7100

// Shared secret. When set, the brain must send {"cmd":"auth","token":"..."}
// before any other command. Leave empty only for local testing.
token:

// How often (ms) the server pushes the state of every bot to the brain.
// Lower = smoother reactions, more traffic. 300-1000 is reasonable.
state_interval: 500

// Maximum number of bots that can be online at the same time.
max_bots: 200

// Log all bots out when the last brain disconnects? (yes/no)
// "no" keeps them standing in the world until the brain reconnects.
logout_on_disconnect: no

// Table that holds characters (used to look up bots by name).
char_table: char

// Range (cells) in which bots "hear" public chat.
chat_range: 14

// Maximum range allowed for the "scan" command.
scan_range_max: 30

// Encoding used by your game clients for chat and names.
// The brain always talks UTF-8; the bridge converts.
//   cp874  : Thai clients (TIS-620 / Windows-874)  [default]
//   latin1 : raw single-byte passthrough
//   utf8   : client already uses UTF-8
client_encoding: cp874

// Max commands processed per brain connection per server cycle
// (protects the map-server main loop from command floods).
max_commands_per_cycle: 200

// Print every command result to the console.
debug: no

import: conf/import/aibot_conf.txt
